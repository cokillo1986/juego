<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KIMBALA VIKINGO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:Arial;color:#fff}
#game{position:fixed;inset:0;width:100vw;height:100dvh;background:url('fondo.jpg') center/cover no-repeat;overflow:hidden}
#vikingo{position:absolute;bottom:70px;left:80px;width:170px;height:230px;background:url('vikingo.png') center/contain no-repeat;filter:drop-shadow(0 10px 15px rgba(0,0,0,.7))}
#vikingo.atacando{transform:scale(1.15) rotate(-8deg)}
.lobo{position:absolute;bottom:70px;width:90px;height:90px;font-size:70px}
.gema{position:absolute;font-size:40px;filter:drop-shadow(0 0 12px gold);animation:flota 1s infinite alternate}
@keyframes flota{from{transform:translateY(0)}to{transform:translateY(-12px)}}
#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:10}
.pill{background:rgba(0,0,0,.75);border:2px solid #ffcc00;border-radius:20px;padding:8px 14px;font-weight:bold}
#ctrl{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 12px;z-index:10}
.joy{width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid #fff;position:relative}
#stick{width:52px;height:52px;border-radius:50%;background:#ffcc00;position:absolute;left:34px;top:34px}
.btn{width:64px;height:64px;border-radius:50%;border:3px solid #fff;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font-size:26px}
#atk{width:82px;height:82px;background:#c62828;font-size:34px}
#start{position:absolute;inset:0;background:rgba(0,0,0,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:20;padding:20px}
#play{background:#ffcc00;border:none;padding:15px 30px;border-radius:14px;font-weight:bold;font-size:20px}
</style></head><body>
<div id="game">
<div id="hud"><div class="pill">❤️ <span id="life">100</span> | 💎 <span id="gems">0</span>/7</div><div class="pill">🪙 <span id="coins">0</span> | KIMBALA</div></div>
<div id="vikingo"></div>
<div id="ctrl"><div style="display:flex;gap:10px;align-items:flex-end"><div class="joy" id="joy"><div id="stick"></div></div><div class="btn" id="jump">⬆️</div></div><div class="btn" id="atk">🪓</div></div>
<div id="start"><h1 style="color:#ffcc00;font-size:34px">KIMBALA<br>VIKINGO</h1><p style="margin:12px 0;line-height:1.5">TÚ de vikingo en Valencia nevada<br>Recoge 7 gemas, mata lobos<br>📳 Vibra al coger gemas</p><button id="play">▶️ JUGAR</button></div>
</div>
<script>
let x=80,gems=0,coins=0,keys={l:false,r:false},run=false;
let vik=document.getElementById('vikingo'), game=document.getElementById('game');
function crear(){for(let i=0;i<7;i++){let g=document.createElement('div');g.className='gema';g.textContent='💎';g.style.left=(500+i*350)+'px';g.style.bottom=(180+Math.random()*120)+'px';g.dataset.x=500+i*350;game.appendChild(g);}for(let i=0;i<5;i++){let l=document.createElement('div');l.className='lobo';l.textContent='🐺';l.style.left=(800+i*400)+'px';l.dataset.x=800+i*400;game.appendChild(l);}}
function loop(){if(!run)return;if(keys.l)x-=6;if(keys.r)x+=6;if(x<0)x=0;if(x>900)x=900;vik.style.left=x+'px';document.querySelectorAll('.gema').forEach(g=>{if(Math.abs(parseInt(g.dataset.x)-x)<70){g.remove();gems++;coins+=100;if(navigator.vibrate)navigator.vibrate(60);document.getElementById('gems').textContent=gems;document.getElementById('coins').textContent=coins;if(gems>=7){alert('🏆 ¡VICTORIA KIMBALA! ¡7 gemas!');run=false;}}});requestAnimationFrame(loop);}
document.getElementById('play').onclick=()=>{document.getElementById('start').style.display='none';run=true;crear();loop();if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{})};
let joy=document.getElementById('joy'),stick=document.getElementById('stick');
joy.addEventListener('touchmove',e=>{let r=joy.getBoundingClientRect(),dx=e.touches[0].clientX-(r.left+r.width/2);keys.l=dx<-15;keys.r=dx>15;stick.style.left=(34+Math.max(-28,Math.min(28,dx)))+'px';});joy.addEventListener('touchend',()=>{keys.l=false;keys.r=false;stick.style.left='34px'});
document.getElementById('jump').addEventListener('touchstart',()=>{vik.style.bottom='180px';setTimeout(()=>vik.style.bottom='70px',400)});
document.getElementById('atk').addEventListener('touchstart',()=>{vik.classList.add('atacando');if(navigator.vibrate)navigator.vibrate(40);setTimeout(()=>vik.classList.remove('atacando'),200)});
</script></body></html>
