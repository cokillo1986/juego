<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memoria Online 2 Jugadores</title>
<style>
  *{box-sizing:border-box} body{font-family:sans-serif;text-align:center;background:#f0f0f0;padding:16px;margin:0}
  .caja{background:white;padding:16px;border-radius:12px;max-width:500px;margin:10px auto}
  input,select,button{padding:12px;font-size:16px;border-radius:10px;border:1px solid #ccc;width:100%;margin:5px 0}
  button{background:black;color:white;border:none;cursor:pointer;font-weight:bold}
  button.sec{background:#2196F3}
  button:disabled{opacity:0.5}
  #tablero{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:500px;margin:16px auto}
  .carta{aspect-ratio:1;background:#222;color:white;font-size:32px;display:flex;align-items:center;justify-content:center;border-radius:10px;cursor:pointer}
  .carta.volteada{background:white;color:black}
  .carta.acertada{background:#4CAF50}
  .carta.bloqueada{opacity:0.7;cursor:not-allowed}
  .jugador{padding:10px;border-radius:10px;background:white;border:3px solid transparent;display:inline-block;min-width:140px;margin:5px}
  .jugador.activo{border-color:black;background:#fff8c5}
  #codigoSala{font-size:28px;font-weight:bold;letter-spacing:4px;color:#2196F3}
</style>
</head>
<body>
<h1>🧠 Memoria Online</h1>

<div id="lobby" class="caja">
  <h2>1. Pon tu nombre</h2>
  <input id="miNombre" placeholder="Tu nombre, ej: Ana">
  <select id="tema"><option value="frutas">🍎 Frutas</option><option value="animales">🐶 Animales</option><option value="coches">🚗 Coches</option><option value="deportes">⚽ Deportes</option></select>
  <button id="btnCrear" onclick="crear()">Crear partida y dar código</button>
  <p>— o —</p>
  <input id="codigoUnirse" placeholder="Código, ej: AB12">
  <button id="btnUnirse" class="sec" onclick="unirse()">Unirse con código</button>
  <p id="error"></p>
</div>

<div id="juego" style="display:none">
  <div class="caja">
    <p>Comparte este código con tu amigo:</p>
    <div id="codigoSala"></div>
    <p id="estado">Esperando a que se una tu amigo...</p>
    <div><span id="card1" class="jugador activo"><b id="n1"></b><br><span id="p1">0</span> parejas</span> <span id="card2" class="jugador"><b id="n2"></b><br><span id="p2">0</span> parejas</span></div>
    <p id="turnoTexto"></p>
  </div>
  <div id="tablero"></div>
  <p id="mensaje"></p>
  <button onclick="location.reload()">Salir / Nueva partida</button>
</div>

<script>
const URL ="https://script.google.com/macros/s/AKfycbzSqV6HCN7zAhUzAaA3NDPgVUA_J1vKspr4EgC9gRx2G_aOHCg4A3Ryx_6x1ih2CI_wHA/exec";
let codigo="", soyJugador=1, miNombre="", estadoActual=null, yaTapando=false, intervalo=null;

async function crear(){
  miNombre = document.getElementById('miNombre').value.trim() || 'Jugador 1';
  const tema = document.getElementById('tema').value;
  document.getElementById('btnCrear').disabled = true;
  document.getElementById('btnCrear').innerText = 'Creando...';
  try{
    const res = await fetch(URL, {method:'POST', body: JSON.stringify({action:'crear', nombre: miNombre, tema})});
    const data = await res.json();
    if(data.error){ document.getElementById('error').innerText = data.error; return; }
    codigo = data.code; soyJugador = 1;
    entrarJuego();
  }catch(e){ document.getElementById('error').innerText = 'Error de conexión, prueba otra vez'; document.getElementById('btnCrear').disabled=false; document.getElementById('btnCrear').innerText='Crear partida y dar código'; }
}
async function unirse(){
  miNombre = document.getElementById('miNombre').value.trim() || 'Jugador 2';
  codigo = document.getElementById('codigoUnirse').value.toUpperCase().trim();
  if(!codigo) { document.getElementById('error').innerText='Pon el código'; return; }
  try{
    const res = await fetch(URL, {method:'POST', body: JSON.stringify({action:'unirse', code: codigo, nombre: miNombre})});
    const data = await res.json();
    if(data.error){ document.getElementById('error').innerText = 'Ese código no existe'; return; }
    soyJugador = 2;
    entrarJuego();
  }catch(e){ document.getElementById('error').innerText = 'Error de conexión'; }
}
function entrarJuego(){
  document.getElementById('lobby').style.display='none';
  document.getElementById('juego').style.display='block';
  document.getElementById('codigoSala').innerText = codigo;
  if(intervalo) clearInterval(intervalo);
  intervalo = setInterval(actualizar, 1500);
  actualizar();
}
async function actualizar(){
  if(!codigo) return;
  try{
    const res = await fetch(URL + "?code=" + codigo);
    const s = await res.json();
    if(s.error) return;
    estadoActual = s;
    document.getElementById('n1').innerText = s.jugadores[0] || '...';
    document.getElementById('n2').innerText = s.jugadores[1] || 'Esperando...';
    document.getElementById('p1').innerText = s.puntos[0];
    document.getElementById('p2').innerText = s.puntos[1];
    document.getElementById('card1').classList.toggle('activo', s.turno===1);
    document.getElementById('card2').classList.toggle('activo', s.turno===2);
    document.getElementById('estado').innerText = s.empezado ? 'Partida en curso' : 'Esperando a que se una tu amigo...';
    document.getElementById('turnoTexto').innerText = s.ganador ? '¡Fin!' : (!s.empezado ? 'Comparte el código' : (s.turno===soyJugador ? '👉 ES TU TURNO' : 'Esperando turno del otro...'));

    const tablero = document.getElementById('tablero');
    tablero.innerHTML='';
    s.board.forEach((emoji, i)=>{
      const div = document.createElement('div');
      div.className='carta';
      const esVolteada = s.volteadas.includes(i);
      const esAcertada = s.acertadas.includes(i);
      if(esAcertada){ div.classList.add('acertada'); div.innerText=emoji; }
      else if(esVolteada){ div.classList.add('volteada'); div.innerText=emoji; }
      else { div.innerText='?'; }
      // Bloquear si no es tu turno, si ya hay 2 volteadas o si está pendiente tapar
      const bloqueado = s.ganador || !s.empezado || s.turno !== soyJugador || s.pendienteTapar || s.volteadas.length >= 2;
      if(bloqueado) div.classList.add('bloqueada');
      div.onclick = ()=> jugar(i);
      tablero.appendChild(div);
    });

    if(s.ganador){
      document.getElementById('mensaje').innerText = s.ganador==='Empate' ? '¡Empate!' : '🏆 ¡Gana ' + s.ganador + '! ' + s.puntos[0] + ' - ' + s.puntos[1];
    } else {
      document.getElementById('mensaje').innerText = '';
    }

    // CORREGIDO: SOLO tapa el que tiene el turno (el que acaba de jugar). Antes tapaban los 2 y el turno se duplicaba.
    if(s.pendienteTapar && s.turno === soyJugador && !yaTapando){
      yaTapando=true;
      setTimeout(async ()=>{
        await fetch(URL, {method:'POST', body: JSON.stringify({action:'tapar', code: codigo})});
        yaTapando=false;
        actualizar();
      }, 1500);
    }
  }catch(e){ /* si falla un tick, el siguiente lo arregla */ }
}
async function jugar(i){
  if(!estadoActual || !estadoActual.empezado) return alert('Espera a que se una tu amigo');
  if(estadoActual.turno !== soyJugador) return alert('No es tu turno');
  if(estadoActual.ganador) return;
  if(estadoActual.pendienteTapar) return;
  if(estadoActual.volteadas.includes(i) || estadoActual.acertadas.includes(i)) return;
  if(estadoActual.volteadas.length >= 2) return;
  await fetch(URL, {method:'POST', body: JSON.stringify({action:'jugar', code: codigo, index: i})});
  actualizar();
}
</script>
</body>
</html>
